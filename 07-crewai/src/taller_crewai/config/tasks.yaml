tarea_investigacion:
  description: >
    Investiga el panorama actual, los principales líderes, eventos recientes y el impacto de {topic}.
    Asegúrate de buscar información relevante considerando que la fecha actual es {current_date}.
    Incluye las posturas principales y menciona claramente de dónde extrajiste la información.
  expected_output: >
    Una lista detallada con los 8 puntos clave más relevantes sobre {topic}, 
    explicando el contexto de cada uno y citando la fuente de la información.
  agent: investigador_informacion

tarea_redaccion:
  description: >
    Usando los hallazgos de la investigación, redacta un artículo de noticias profesional y 
    cautivador sobre {topic}. El artículo debe tener un titular llamativo que sea algo exagerado, una bajada o subtitulo, una  
    lead y el cuerpo de la noticia.
  expected_output: >
    Un artículo periodístico completo en formato markdown con las secciones: 
    Titular, Subtitulo, Lead, Cuerpo de la Noticia, y Fuentes Consultadas.
  agent: redactor_noticia

